# 표본 데이터 프로파일.
#
# 실행: SPRING_PROFILES_ACTIVE=seed ./gradlew bootRun
#
# 이 파일이 하는 일은 하나다 -- 시드 데이터를 Flyway에 보이게 만드는 것.

# [왜 local이 아니라 seed인가]
#
# .gitignore가 application-local.properties를 제외한다. "머신마다 다른 개인 설정"을
# 커밋하지 않으려는 규칙이고 그건 유지되는 편이 맞다 -- 그 이름을 풀면 나중에 누군가
# 자기 DB 비밀번호를 적어 커밋할 여지가 생긴다.
#
# 그런데 시드를 켜는 설정은 반대로 공유되어야 한다. 저장소를 받은 사람에게
# 시드 SQL은 있는데 그것을 켜는 파일이 없으면 수단이 없는 것과 같다.
#
# 그래서 이름을 갈랐다. seed는 커밋되고 local은 계속 개인용으로 남는다.
# 둘은 함께 켤 수 있다: SPRING_PROFILES_ACTIVE=seed,local

# [시드 데이터]
#
# spring.flyway.locations 기본값은 classpath:db/migration 하나다.
# 여기에 db/seed를 더해야 R__seed_sample.sql이 비로소 적용된다.
#
# 반대로 말하면 이 줄이 없는 환경(= 운영, CI, 기본 로컬)에서는 Flyway가
# db/seed 디렉터리를 열어보지도 않는다. 시드 파일이 클래스패스에 있어도
# 상관없다는 뜻이고, 그게 이 배치의 목적이다.
#
# 삭제한 data.sql은 구조가 반대였다 -- 기본 경로에 놓여 있고 스위치
# 하나(spring.sql.init.mode)로만 막혀 있어서, 그 스위치를 켜는 순간
# 어디서든 돌 수 있는 상태였다.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# [기동 직후 RAG 색인]
#
# 시드는 원본(work_logs / work_log_translations / safety_courses)만 넣는다.
# document_chunks를 채우려면 임베딩이 필요하고 그것은 IndexingService의 일인데,
# 배치는 기본적으로 매일 03:00에만 돈다(rag.indexing.cron).
#
# 즉 시드를 넣고 앱을 띄워도 RAG 검색은 다음 새벽까지 빈손이다.
# 로컬에서 그걸 기다릴 이유가 없으므로 기동 직후 한 번 돌릴 수 있게 열어 둔다.
#
# 기본값을 false로 두는 이유: TEI(임베딩 서버)가 떠 있어야 하고, 코퍼스가 크면
# 기동이 그만큼 늦어진다. CorpusSeedGeneratorTest로 수만 건을 넣어둔 상태라면
# 기동에 수십 분이 걸린다. 필요할 때만 켠다.
#
# 켜는 법: RAG_INDEXING_ON_STARTUP=true SPRING_PROFILES_ACTIVE=seed ./gradlew bootRun
rag.indexing.on-startup=false
