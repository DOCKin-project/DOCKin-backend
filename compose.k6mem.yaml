# k6 부하 테스트(measure/k6-load)용 오버라이드.
#
#   docker compose -f compose.yaml -f compose.gc.yaml -f compose.k6mem.yaml up -d dockin-app
#
# 밤 15에는 앱 컨테이너 메모리 512M → 1G도 여기서 올렸다(#112). 그 값은 #131로 compose.yaml에
# 들어갔으므로 지웠다 — 같은 수치를 두 곳에 적지 않는다.
services:
  dockin-app:
    environment:
      # compose.gc.yaml 이 켜는 기동 직후 색인을 끈다. 계정 풀과 함께 넣은 작업일지 12만 건을 색인하기
      # 시작하면 (1) app 1.0 vCPU 를 색인이 나눠 먹고 (2) ApplicationRunner 가 끝날 때까지
      # readinessState 가 OUT_OF_SERVICE 라 healthcheck 가 503 이다. E3 는 "색인과 같은 시간에 돌리지 않는다".
      - RAG_INDEXING_ON_STARTUP=false
      - RAG_INDEXING_ENABLED=false
      # 풀 고갈 진단: 5초 넘게 잡고 있는 커넥션의 보유자 스택을 WARN으로 찍는다(밤 15 u16 진단). 운영 기본값은 0(끔).
      - SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD=5000
