version: '3.8'

services:
  dockin-nginx:
    image: nginx:latest
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - dockin-app
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M

  dockin-app:
    #build: .
    env_file:
      - .env
    image: khyojae/dockin-app:latest
    container_name: dockin-app-1
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=DOCKin-DB
      - DB_NAME=dockindb
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=dockin-redis
      - REDIS_PORT=6379
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - SPRING_PROFILES_ACTIVE=secret
      - TZ=Asia/Seoul
      - RACK_ENV=development
      - JAVA_OPTS=-Xmx400M -Xms256M
      - AI_SERVER_URL=${AI_SERVER_URL}
      - EMBEDDING_SERVER_URL=http://dockin-embedding:80
      - cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
      - cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
      - cloud.aws.region.static=${AWS_REGION}
      - cloud.aws.s3.bucket=${S3_BUCKET_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      DOCKin-DB:
        condition: service_healthy
      dockin-redis:
        condition: service_started
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 512M # Spring Boot 최대치 제한

  dockin-redis:
    image: redis:7-alpine
    container_name: dockin-redis
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M # 출근 분산락 전용, 소용량으로 제한

  # MySQL 8.0에서 PostgreSQL로 이관했다(ADR-0006 3절). 이관 근거 요약:
  #  - 벡터 검색: MySQL 8.0에 ANN 인덱스가 없다(9.x의 VECTOR도 인덱스는 HeatWave 전용).
  #    브루트포스 10만 청크가 5.2초이고 병목의 81%가 애플리케이션으로 벡터를 가져오는 전송이라,
  #    유사도 계산을 DB 안에서 끝내는 pgvector가 유일한 해법이다.
  #  - 배치 INSERT: IDENTITY 전략이 JDBC 배치를 막았다. 시퀀스는 INSERT 전에 키를 받아 배치가 된다.
  #  - 락 대기 한도: MySQL은 서버/세션 단위까지만 조정 가능하나, PostgreSQL은
  #    SET LOCAL lock_timeout으로 트랜잭션 단위 조정이 된다.
  #
  # 이미지는 pgvector 포함본을 쓴다. 순수 postgres의 상위 집합이라 지금 비용이 없고,
  # 2b(pgvector 도입) 때 이미지를 다시 바꾸지 않아도 된다.
  DOCKin-DB:
    image: pgvector/pgvector:pg17
    container_name: dockin-db
    command:
      # 락 대기 한도. 기본값은 무제한(0)이라 승인이 영원히 매달릴 수 있다.
      # 전역 기본은 5초로 두고, 오래 잡아야 하는 배치는 트랜잭션 단위로 SET LOCAL로 늘린다.
      # MySQL에서는 이 트랜잭션 단위 조정이 불가능해 전역 5초로 고정할 수밖에 없었다.
      - -c
      - lock_timeout=5s
      # 데드락 감지 주기. 기본 1초.
      - -c
      - deadlock_timeout=1s
      # 실행된 문장 수를 세기 위해 활성화한다. MySQL의 Com_insert에 해당하는 수단으로,
      # "배치 설정이 실제로 동작하는가"를 추정이 아니라 DB가 센 값으로 확인하는 데 쓴다.
      # (MySQL 시절 batch_size가 IDENTITY 때문에 조용히 무시되던 것을 이 방식으로 잡아냈다.)
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=dockindb
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - dockin_db_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d 마운트를 제거했다(2026-08-05).
      # CREATE EXTENSION vector를 여기서 하고 있었으나 두 가지 한계가 있었다 --
      # 데이터 디렉터리가 비어 있을 때만 돌아 기존 볼륨에는 적용되지 않았고,
      # 그 시점에는 테이블이 없어 HNSW 인덱스는 어차피 만들 수 없었다.
      # 지금은 Flyway V1이 확장->테이블->인덱스를 기동 경로에서 한 번에 보장한다.
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dockindb" ]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 512M # MySQL(300M)보다 여유를 둔다. 벡터 검색 시 공유 버퍼가 필요하다.

  # RAG 임베딩 추론 서버 (HuggingFace text-embeddings-inference)
  # 팀원 FastAPI(AI_SERVER_URL)와는 별개 서비스다. 번역/STT와 무관하며 텍스트->벡터 변환만 담당한다.
  # dockin-app이 depends_on을 걸지 않는 이유: 임베딩 서버가 죽어도 검색은 LIKE 폴백으로 동작해야 하므로
  # 기동 의존성을 만들지 않는다(ADR-0001의 "Redis가 죽어도 DB가 최종 방어선" 원칙과 동일).
  dockin-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: dockin-embedding
    command:
      # multilingual-e5-small: 118M 파라미터 / 384차원.
      # bge-m3(568M)는 이 환경(i3-6100, 2코어)에서 인덱싱 처리량이 안 나와 제외했다.
      - --model-id=intfloat/multilingual-e5-small
      # 모델 최대 시퀀스(512 토큰) 초과 입력에서 에러 대신 잘라내기. 작업일지 본문이 길 수 있다.
      - --auto-truncate
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8081:80"
    volumes:
      - embedding_cache:/data # 모델 가중치 캐시. 최초 1회만 다운로드한다.
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  dockin-network:
    driver: bridge

volumes:
  dockin_db_data:
  embedding_cache: