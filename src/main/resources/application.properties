spring.application.name=DOCKin-spring

# [Database Configuration]

#[aws MySQL]
# PostgreSQL로 이관(ADR-0006 3절). MySQL 시절의 rewriteBatchedStatements는
# PostgreSQL 드라이버에 해당 옵션이 없어 제거했다 - 드라이버가 기본적으로 배치를 묶어 보낸다.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/dockindb
#spring.datasource.url=jdbc:mysql://dockin-db.crioe6iq4jv2.ap-northeast-2.rds.amazonaws.com:3306/dockindb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
#spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# [HikariCP]
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# [Redis] - 출근 체크 분산락용
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# [SQL Init]
#
# 스키마도 시드 데이터도 이 경로로 넣지 않는다.
#   - 스키마: Hibernate ddl-auto + Flyway (아래 [Flyway] 참고)
#   - 시드 데이터: 현재 없다. data.sql은 2026-08-05에 삭제했다 -- MySQL 문법이었고,
#     attendance.role처럼 존재하지 않는 컬럼을 참조했으며, 애초에 실행되지도 않았다.
#     다시 넣는다면 Flyway repeatable 마이그레이션이나 테스트 픽스처가 맞는 자리다(백로그 P0-13-4).
spring.sql.init.mode=never
# defer-datasource-initialization은 spring.sql.init을 Hibernate DDL 뒤로 미루는 설정이다.
# init.mode=never라 미룰 대상이 애초에 없어 아무 일도 하지 않던 잔재였고,
# Flyway 도입 후에는 초기화 순서를 흔들어 flyway <-> entityManagerFactory 순환을 만든다.
#spring.jpa.defer-datasource-initialization=true

# [Flyway]
#
# Hibernate ddl-auto가 할 수 없는 것만 담당한다 - CREATE EXTENSION(테이블보다 먼저 필요)과
# HNSW 인덱스(@Index는 btree만 만든다). 둘 다 빠뜨려도 에러가 나지 않고 조용히 잘못되는
# 종류라서, 사람이 기억해야 하는 절차로 두지 않고 기동 경로에 넣었다.
#
# Spring Boot가 JPA EntityManagerFactory보다 Flyway를 먼저 실행하므로
# 확장 -> 테이블 -> 인덱스 순서가 한 번에 보장된다.
spring.flyway.enabled=true
# 이미 테이블이 있는 DB에도 적용하기 위한 설정.
# baseline-version=0이라 V1부터 실제로 실행된다(V1은 전부 IF NOT EXISTS라 멱등).
# 이 값을 1로 두면 기존 DB에서 V1이 "이미 반영된 것"으로 간주되어 건너뛴다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# 시드(db/seed/R__seed_sample.sql)는 seed 프로파일에서만 locations에 들어간다.
# 그런데 Flyway는 적용한 repeatable 마이그레이션을 flyway_schema_history에 기록하므로,
# 한 번 시드를 넣은 DB를 seed 프로파일 없이 띄우면 "적용됐는데 파일이 없다"며 기동을 거부한다.
#
#   FlywayValidateException: Migrations have failed validation
#
# 즉 "프로파일을 안 켜면 안 보인다"가 한 번 켠 뒤에는 "안 켜면 못 뜬다"가 된다.
# 운영은 시드를 적용한 적이 없어 무관하지만, 개발자는 매번 걸린다
# (실제로 SchemaValidationTest가 이걸로 깨졌다).
#
# repeatable에 한해 "파일 없음"을 무시한다. versioned 마이그레이션은 여전히 엄격하게
# 검증되므로 V1/V2가 사라지거나 바뀐 것은 그대로 잡힌다 -- 느슨하게 푸는 범위를
# 시드가 속한 종류로만 좁힌 것이다.
spring.flyway.ignore-migration-patterns=repeatable:missing

# [JPA / Hibernate]
#
# validate: 매핑과 실제 테이블을 대조만 하고 고치지 않는다. 어긋나면 기동이 실패한다.
#
# 2026-08-05에 update에서 내렸다(백로그 P0-13-3). update는 이름과 달리 추가만 하고
# 컬럼 삭제 / 타입 변경 / NOT NULL 완화를 반영하지 않으며, DDL이 실패해도 로그만 남기고
# 기동을 막지 않는다 - 실제로 두 번 당했다(SafetyCourse의 DATETIME, vector 확장 미등록).
# 스키마 정의가 어디에도 없어 어긋나도 비교할 대상이 없다는 것이 근본 문제였다.
#
# 이제 스키마는 db/migration/V*.sql이 전부 만든다. 엔티티를 고쳤으면 마이그레이션도
# 함께 써야 하며, 빠뜨리면 기동이 실패해서 알려준다.
spring.jpa.hibernate.ddl-auto=validate

# JDBC 배치.
#
# MySQL 시절에는 IDENTITY 전략이 JDBC 배치를 막아 이 설정이 조용히 무시됐다
# (Com_insert 측정: 10,000건 저장에 INSERT 문장 10,000개).
# PostgreSQL 이관과 함께 대량 적재 대상 엔티티를 GenerationType.SEQUENCE로 바꿔
# 배치가 실제로 동작하게 했다 - 시퀀스는 INSERT 전에 키를 받으므로 문장을 묶을 수 있다.
# 검증 코드: HibernateBatchInsertVerificationTest
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.defer-datasource-initialization=false

# [Logging]
logging.level.org.springframework.boot.autoconfigure.sql.init=DEBUG

# [JWT]
jwt.expiration_time=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}
jwt.refresh_expiration_time=${JWT_REFRESH_EXPIRATION}

# [SWAGGER]
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# [FastAPI Configuration]
external-api.fastapi.base-url=${AI_SERVER_URL}

# [외부 HTTP 타임아웃]
#
# Reactor Netty 기본값은 연결 30초 / 응답 무한이다. 즉 연결은 됐는데 응답이 오지 않는
# 상대를 만나면 영원히 매달린다. ChunkIndexWriter가 @Transactional 안에서 임베딩을
# 호출하므로, 임베딩 서버가 멎으면 트랜잭션이 안 닫히고 -> 커넥션이 반납되지 않고 ->
# HikariCP 풀이 말라 서비스 전체가 멎는다. 그 고리를 끊는 설정이다.
#
# 연결 타임아웃: 상대가 아예 없거나 TCP 수립이 안 되는 경우. 같은 네트워크 안이라 짧게 잡는다.
external-api.connect-timeout-ms=3000
# FastAPI: 번역/STT/챗봇이라 본래 오래 걸린다. 다만 Nginx proxy_read_timeout 기본값이
# 60초라 그보다 오래 기다려도 사용자는 이미 끊긴 뒤다(백로그 P2-9-3).
external-api.fastapi.response-timeout-ms=60000
# 임베딩(TEI): 처음에 20초로 잡았다가 10만 건 색인이 이 타임아웃에 걸려 죽어서 올렸다.
#
# 근거였던 "12ms/건"이 틀린 값이었다. TEI를 직접 재보니 청크 길이에 크게 좌우된다:
#   149자 x 32건 = 1,473ms  (건당  46ms)
#   317자 x 32건 = 4,891ms  (건당 153ms)
# 실제 코퍼스에는 700자짜리도 섞여 있고, 색인 중에는 TEI가 PostgreSQL과 2코어를 두고
# 경쟁하므로 배치 한 번이 20초를 넘길 수 있다.
#
# 60초로 둔다. 트랜잭션을 물고 있어 짧을수록 좋지만, 정상 동작을 죽이는 값이면 의미가 없다.
# 더 줄이려면 타임아웃이 아니라 rag.embedding.batch-size를 낮춰 호출당 작업량을 줄여야 한다.
external-api.embedding.response-timeout-ms=60000

# RAG 임베딩 추론 서버 (TEI). 도커 밖 로컬 실행 시 8081 포트를 기본값으로 쓴다.
external-api.embedding.base-url=${EMBEDDING_SERVER_URL:http://localhost:8081}
# 모델명은 document_chunks.embedding_model에 기록되어 모델 교체 시 구버전 청크 식별에 쓰인다.
rag.embedding.model=intfloat/multilingual-e5-small
# 배치 호출이 단건 대비 약 8배 빠르다(실측: 12ms/건 vs 99ms/건).
# TEI 기본 max-client-batch-size가 32라 그에 맞춘다.
rag.embedding.batch-size=32
# 인덱싱 배치 실행 여부. 로컬/테스트에서는 끔 수 있다.
rag.indexing.enabled=true
# 기본 매일 03:00. 10만 청크 기준 약 20분 소요(실측).
rag.indexing.cron=0 0 3 * * *
# 근거로 채택할 최소 코사인 유사도. 0.0이면 비활성.
#
# e5 계열은 무관한 문장 사이에서도 코사인이 높게 나온다. 실측으로 확인됐다
# (SERVICE-SCALE-ASSUMPTIONS 6-7 발견 9):
#
#   관련 있음  "고소작업 안전대 착용 규정"        0.9058
#   관련 있음  "용접할 때 지켜야 할 것"           0.8703
#   완전 무관  "오늘 점심 메뉴로 김치찌개 어떨까" 0.8105
#   완전 무관  "파이썬 웹 크롤러 만드는 법"       0.8023
#
# 안전 구간이 0.81~0.87로 0.06밖에 안 된다. 0.85를 걸면 정상 질의가 아슬아슬하고
# 0.80을 걸면 김치찌개가 통과한다. 절대 임계값으로 쓸 수 있는 폭이 아니라서 비활성으로 둔다
# - 상대 순위(top-k)가 이 모델을 쓰는 올바른 방법이다.
#
# 그리고 위 수치를 임계값으로 박아서도 안 된다. 코퍼스가 30청크일 때의 값이고,
# 후보가 늘면 우연히 가까운 것이 나올 확률이 올라가 무관 질의의 최고값도 함께 오른다.
# 즉 안전 구간은 지금보다 더 좁아진다. 규모를 키워 재측정이 필요하다. [실측 필요]
rag.search.min-score=0.0
# 챗봇 프롬프트에 붙일 근거 청크 최대 개수. 청크당 약 500자이므로 5건이면 약 2,500자다.
rag.search.top-k=5

# 미체크 인원 결근 처리 배치. 전날을 대상으로 하므로 자정 직후에 돈다.
# 주말은 건너뛰지만 공휴일은 판단하지 못한다(근무일 캘린더 부재) - AttendanceBatchService 주석 참고.
attendance.absent-batch.enabled=true
attendance.absent-batch.cron=0 10 0 * * *

# [File Upload Configuration]
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.async.request-timeout=120000

# [CORS]
#
# 2026-08-05 이전에는 WebConfig/WebSocketConfig 둘 다 allowedOriginPatterns("*")에
# allowCredentials(true)였다. 아무 사이트나 사용자의 인증 정보를 실어 이 API를 호출하고
# 그 응답을 읽을 수 있다는 뜻이다.
#
# 스펙상 allowedOrigins("*")와 allowCredentials(true)는 함께 못 쓰고 스프링이 예외로 막는데,
# allowedOriginPatterns는 그 검사를 통과한다 - 같은 위험을 예외 없이 지나가게 하는 우회로였다.
#
# 기본값은 로컬 개발용이다. 운영에서는 CORS_ALLOWED_ORIGINS로 실제 도메인만 준다.
# 값이 하나여도 콤마 구분 문자열로 넣으면 String[]에 바인딩된다.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost}

# [Whitelist]
security.whitelist[0]=/
security.whitelist[1]=/error
security.whitelist[2]=/favicon.ico
security.whitelist[3]=/v3/api-docs
security.whitelist[4]=/v3/api-docs/
security.whitelist[5]=/v3/api-docs/**
security.whitelist[6]=/swagger-ui/**
security.whitelist[7]=/swagger-ui.html
security.whitelist[8]=/api-docs/**
security.whitelist[9]=/swagger-resources/**
security.whitelist[10]=/webjars/**
security.whitelist[11]=/member/login
security.whitelist[12]=/member/signup
security.whitelist[13]=/css/**
security.whitelist[14]=/js/**
security.whitelist[15]=/img/**
security.whitelist[16]=/ws/**
