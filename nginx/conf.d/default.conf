# DOCKin 리버스 프록시
#
# 이 파일이 고쳐진 이유(P2-9-2~4, 2026-08-07) -- 여기 있던 문제 셋은 전부
# "설정 두 개가 서로 안 맞아서 조용히 잘못되는" 부류였다. 이 저장소가 지금까지 잡아온 것들
# (batch_size <-> IDENTITY, JPA 락 힌트 <-> MySQL, @Lob <-> validate, JAVA_OPTS <-> ENTRYPOINT)과
# 같은 성격이고 층위만 애플리케이션에서 인프라로 옮겨간 것이다.
#
# 관통하는 원칙 하나 -- 한도가 두 곳에 있으면 "누가 거절하는가"를 정해야 한다.
# 여기서는 전부 애플리케이션을 거절 주체로 두고 nginx는 그보다 느슨한 바깥 울타리로 뒀다.
# 그래야 클라이언트가 받는 것이 nginx의 기본 HTML이 아니라 ErrorResponseDto가 된다.

# WebSocket 업그레이드용 Connection 헤더 값.
#
# `Connection: upgrade`를 location에 하드코딩하지 않고 map을 쓰는 이유는,
# /ws로 업그레이드가 아닌 평범한 HTTP 요청이 올 수 있기 때문이다(SockJS 폴백을 붙이면 실제로 그렇다).
# 그때 upgrade를 강제로 붙이면 그 요청이 깨진다. 요청이 실제로 업그레이드일 때만 붙인다.
#
# conf.d/*.conf는 nginx.conf의 http 블록 안에서 include되므로 map이 여기 있어도 된다.
# [상류 연결 재사용] #156, 2026-09-20
#
# upstream 블록 없이 proxy_pass http://dockin-app:8080 이면 nginx는 요청마다 Tomcat에 TCP 연결을
# 새로 열고 닫는다(기본이 HTTP/1.0 + Connection: close). 닫는 쪽이 nginx라 TIME_WAIT 60초를 nginx가
# 안고, 컨테이너의 임시 포트 28,231개(32768-60999) ÷ 60초 ≈ 470 req/s 위에서는 새 연결에 줄 포트가
# 없다 — connect() failed (99: Cannot assign requested address) → 502. AWS 밤 18: 동접 1,000(575 req/s)
# 에서 502 34,991건·실패 29.8%, TIME_WAIT 13,474. 그 아래 도착률에서도 매 단계 50초쯤(TIME_WAIT가
# 범위의 절반을 채우는 자리) nginx CPU가 4% → 30~55%로 튀었다.
#
# keepalive N 은 "워커당 유휴 상류 연결 상한"이지 총량이 아니다. 64 × 워커 2 = 128, Tomcat 스레드 200
# 안쪽. 같은 부하가 실패 0·p95 22ms, TIME_WAIT 109~277, CPU 튐 소멸(밤 18 f48-ka·vus1000-ka).
# proxy_http_version 1.1 + Connection "" 이 없으면 upstream keepalive는 켜도 동작하지 않는다 —
# 아래 location / 참고. /ws 는 이미 1.1 + Upgrade 라 그대로 두고 upstream 이름만 맞춘다.
upstream app {
    server dockin-app:8080;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    charset utf-8;

    # [업로드 한도] P2-9-4
    #
    # 이전에는 10M이었고 spring.servlet.multipart.max-file-size도 10MB였다. 숫자는 같지만
    # 재는 대상이 다르다 -- nginx는 요청 전체, Spring은 파일 하나다. 멀티파트는 경계 문자열과
    # 파트 헤더가 붙으므로 "정확히 10MB인 파일"은 요청 전체가 10M을 넘어 nginx에서 먼저 잘렸다.
    # 즉 앱이 정한 한도가 아니라 우연히 앞에 선 프록시가 한도를 정하고 있었다.
    #
    # 20M으로 올려 여유를 준다. 이제 10MB를 넘는 업로드는 Spring이 거절하고
    # MaxUploadSizeExceededException -> GlobalExceptionHandler를 거쳐 ErrorResponseDto로 나간다.
    # 여기 남은 20M은 한도가 아니라 방어선이다 -- 1GB 업로드를 앱까지 실어 나르지 않기 위한 것.
    client_max_body_size 20M;

    # 그 방어선에 걸렸을 때의 응답 형식.
    #
    # 이 413은 nginx가 직접 내는 것이라 GlobalExceptionHandler를 거치지 않는다.
    # 그대로 두면 이 경로만 응답 형식이 달라져, P0-9가 표준화한 것에 구멍이 하나 남는다.
    #
    # 알아둘 것 둘:
    #  - timestamp가 $time_iso8601이라 오프셋이 붙는다(2026-08-07T16:34:45+09:00).
    #    Jackson이 LocalDateTime을 직렬화한 값에는 오프셋이 없다. 필드 구성은 같지만
    #    문자열 형식은 완전히 같지 않다. nginx에서 더 맞출 수단이 없어 여기까지가 한계다.
    #  - 클라이언트가 본문을 다 보내기 전에 nginx가 끊으므로, 업로드 중인 클라이언트가
    #    이 응답을 읽지 못하고 커넥션 리셋으로 보는 경우가 있다. nginx의 구조적 한계다.
    #    앱이 거절하는 10~20M 구간에서는 이 문제가 없다.
    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"status":413,"message":"업로드 가능한 최대 크기를 초과했습니다.","timestamp":"$time_iso8601"}';
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # 클라이언트의 Connection 헤더를 상류로 넘기지 않는다 — 넘기면 close 가 붙어 재사용이 깨진다
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # [타임아웃] P2-9-3
        #
        # 이전에는 미설정이라 기본 60초였고, spring.mvc.async.request-timeout은 120초였다.
        # 즉 120초는 프록시를 지나는 경로에서 도달할 수 없는 값이었다. 60초에 nginx가 끊고
        # 504 HTML을 내보내는데 Spring은 여전히 작업 중이라, 클라이언트가 재시도하면 같은 작업이 겹쳐 돌았다.
        #
        # 125초는 Spring의 120초보다 5초 크다. 순서를 이렇게 두면 끊는 주체가 앱이 되어
        # ErrorResponseDto로 나간다. 이 5초는 여유이지 의미 있는 값이 아니다.
        #
        # 다만 정직하게 적어둘 것 -- spring.mvc.async.request-timeout은 비동기 경로
        # (Callable/DeferredResult)에만 적용된다. 동기 컨트롤러에는 Spring 쪽 한도가 아예 없으므로
        # 그쪽에서는 여전히 아래 값이 유일한 천장이고, 60초에서 125초로 늘어난 셈이다.
        # 동기 경로의 한도는 이 항목과 별개 문제다(N6와 같은 자리).
        proxy_connect_timeout 5s;
        proxy_send_timeout 125s;
        proxy_read_timeout 125s;
    }

    # [WebSocket] P2-9-2
    #
    # 이 블록이 없어서 /ws 핸드셰이크가 프록시를 통과하지 못했다.
    # nginx는 기본적으로 업스트림에 HTTP/1.0으로 말하고 Upgrade/Connection 같은
    # hop-by-hop 헤더를 걷어낸다. 아래 세 줄이 그것을 되돌린다.
    #
    # 지금까지 채팅이 동작한 이유는 dockin-app이 8080을 직접 노출하고 있어서였다
    # (chat_test.html이 ws://<host>:8080/ws로 직결하고 있었다). 즉 채팅만 리버스 프록시를
    # 우회했고, 그 경로에는 TLS 종단도 프록시 헤더도 접근 제어도 적용되지 않았다.
    location /ws {
        proxy_pass http://app;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket은 연결을 열어두는 것이 정상이라 위의 125초를 그대로 쓸 수 없다.
        # 대화가 없는 동안에도 소켓은 살아 있어야 하는데 read_timeout은 그것을 구분하지 못한다.
        #
        # 2026-09-14: STOMP heartbeat 10초(N5, WebSocketConfig)가 붙어 3600초를 60초로 내렸다.
        # 조용한 연결에도 10초마다 서버→클라이언트 한 줄이 오가므로 read_timeout이 걸릴 일이 없고,
        # 진짜 죽은 연결은 heartbeat 3주기(30초) 안에 양쪽이 알아채고 닫는다. 60초는 그 뒤의 여유다.
        # 이전에는 heartbeat가 없어 "조용한 연결"과 "죽은 연결"이 구분되지 않아 1시간으로 열어둬야 했다.
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
