# nginx 메인 설정. 이미지(nginx:latest) 기본값을 그대로 가져오고 두 줄만 바꿨다 — worker_processes, worker_connections.
# compose.yaml이 /etc/nginx/nginx.conf 로 마운트한다. 서버 블록은 conf.d/default.conf 그대로다.
#
# [왜 파일을 두나 — #144]
# 기본값 worker_processes auto 는 호스트 코어 수만큼 워커를 띄운다(8 vCPU면 8개). 그런데 이 컨테이너는
# cpus 상한이 걸려 있어(compose.yaml) 워커 8개가 쿼터 하나를 나눠 쓰고, 100ms 주기마다 CFS 스로틀에
# 걸린다. AWS 밤 16: 사이클 40/s·동접 500에서 앱 349%·DB 13%·풀 대기 0인데 nginx만 상한(당시 0.25)에
# 붙어 p95가 11.8초였고, 상한을 걷으니 16ms. 워커 수는 호스트 코어가 아니라 컨테이너 쿼터에 맞춰야 한다.
#
# worker_processes 2: 쿼터 1.0(compose.yaml)에 맞춘다. 1이면 워커 하나가 accept·프록시·로그 쓰기를
# 다 하니 블로킹 한 번이 전체를 세운다. 2면 쿼터 안에서 서로 메운다. 4 이상은 다시 스로틀 쪽이다.
# worker_connections 4096: 워커당이다. 동접 500이 병렬 4개씩 열면 2,000 연결이고 upstream 쪽까지 두 배다.
# 기본 1024×8=8192 였던 총량을 워커 2개로 유지한다(2×4096).
user  nginx;
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  4096;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
