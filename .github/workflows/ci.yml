# 테스트 자동 실행.
#
# 이전 워크플로(e672ea9에서 삭제)는 빌드 -> Docker Hub 푸시 -> EC2 배포까지 한 잡에 묶여 있었고,
# 배포 단계가 계속 실패해 통째로 제거됐다. 그 결과 테스트가 1개에서 20개로 늘어나는 동안
# 자동으로 돌아가는 곳이 없었다(백로그 P0-7).
#
# 그래서 이번에는 CI만 복구한다. 배포를 다시 붙이더라도 별도 워크플로여야 한다 --
# 배포 자격증명이 없다는 이유로 테스트 결과까지 빨간불이 되는 구조가 원인이었다.
#
# 이전 워크플로는 `./gradlew clean build -x test`로 테스트를 아예 건너뛰었다.
# 즉 살아 있을 때도 회귀를 잡은 적이 없다.
#
# ---------------------------------------------------------------------------
# 2026-08-07: 이 파일의 전제가 한 번 뒤집혔다 (P2-11-5, Testcontainers 도입)
#
# 직전까지 이 워크플로는 "DB가 필요한 테스트는 CI에서 돌릴 수 없다"를 전제로 쓰여 있었고,
# 그 근거는 아래 두 가지였다. 둘 다 더는 성립하지 않는다.
#
#   1. "벤치마크가 DB 테스트와 스위치를 공유한다"
#      -> DB 제공이 DB_PASSWORD와 무관해졌다. 컨테이너는 테스트 코드가 직접 띄우므로
#         이 변수는 이제 '무거운 벤치마크를 켜는' 용도로만 남았다. CI는 주지 않는다.
#
#   2. "GitHub 서비스 컨테이너에는 postgres 명령 인자를 넘길 자리가 없다"
#      -> 서비스 컨테이너를 쓰지 않는다. Testcontainers가 코드에서 컨테이너를 만들므로
#         compose.yaml과 같은 `-c lock_timeout=5s`를 그대로 줄 수 있다.
#         (실제로 이 인자를 빼고 돌려봤더니 LockTimeoutVerificationTest가 실패가 아니라
#          '멈췄다'. 예측이 맞았고, 동시에 이제 해결됐다는 근거이기도 하다.)
#
# 그 결과 CI에서 실제로 도는 테스트가 단위 테스트 중심에서 121개로 늘었고,
# 스키마 / Flyway / pgvector / 락 / 배치 적재가 처음으로 자동 검증된다.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

# 같은 브랜치에 연속으로 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 + 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설치
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v6

      - run: chmod +x gradlew

      # DB와 Redis는 Testcontainers가 띄운다(ContainerTestSupport). ubuntu-latest에는 Docker가
      # 미리 설치돼 있어 별도 서비스 정의가 필요 없다.
      #
      # 이미지를 먼저 받아두는 것은 실패 원인을 분리하기 위해서다 -- 레지스트리 지연이나
      # 태그 오타로 테스트가 깨지면 원인이 테스트 안에 있는 것처럼 보인다.
      # 여기서 받아두면 그 경우 이 단계가 먼저 빨간불이 된다.
      #
      # Redis가 목록에 늘어난 이유: @SpringBootTest가 전체 컨텍스트를 요구하는데 RedissonConfig가
      # 빈 생성 시점에 실제로 접속한다. 2026-08-07부터 CI가 이것 때문에 깨져 있었다(P2-16).
      - name: 테스트용 컨테이너 이미지 준비
        run: |
          docker pull pgvector/pgvector:pg17
          docker pull redis:7-alpine

      - name: 테스트
        run: ./gradlew test --no-daemon

      # 테스트가 실패해도 리포트는 올린다. 실패했을 때가 정작 필요한 순간이다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: 프로덕션 빌드
        run: ./gradlew assemble --no-daemon

  # -------------------------------------------------------------------------
  # 빨간불이 조용한 상태를 없앤다 (P2-16의 「남은 것」)
  #
  # 2026-08-07부터 닷새 동안 dev가 실패하고 있었는데 아무도 몰랐다. 닷새가 걸린
  # 이유는 원인의 난이도가 아니라 아무도 보지 않았다는 것이다. 다른 일을 하다
  # 우연히 봤다.
  #
  # 메일로는 부족하다는 것이 그 닷새로 증명됐다 -- GitHub는 실패할 때마다 이미
  # 메일을 보내고 있었다. 그래서 읽지 않으면 사라지는 것 말고 닫을 때까지 남는
  # 것에 건다. 열린 이슈는 저장소를 열 때마다 보인다.
  #
  # 푸시에만 건다. PR의 실패는 PR 화면에 이미 빨갛게 보이므로 이슈까지 만들면
  # 같은 것을 두 번 말하는 셈이고, 두 번 말하면 곧 안 보게 된다.
  # -------------------------------------------------------------------------
  notify:
    name: 빨간불 알림
    needs: test
    # 취소된 실행(concurrency)은 알리지 않는다 -- 뒤이은 실행이 곧 결과를 낸다.
    if: always() && github.event_name == 'push' && contains(fromJSON('["success", "failure"]'), needs.test.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # 저장소 기본 토큰 권한이 read다. 여기서 명시하지 않으면 이슈를 만들지 못한다.
    permissions:
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: 🚨 CI
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # 이슈를 브랜치별로 가른다. 라벨만으로 찾으면 dev와 main이 동시에 깨졌을 때
      # 뒤엣것이 앞의 이슈에 댓글만 달고, 한쪽이 복구되면 다른 브랜치 이슈까지 닫힌다.
      # 제목을 키로 쓰는 것은 라벨을 브랜치 수만큼 만들지 않기 위해서다.
      TITLE: CI 빨간불 — ${{ github.ref_name }}

    steps:
      # 라벨이 없으면 gh issue create도, --label을 건 gh issue list도 실패한다.
      # 성공 경로에서도 조회하므로 양쪽 다 필요하다. --force가 멱등이라 매번 시도한다.
      - name: 라벨 준비
        run: gh label create "$LABEL" --color B60205 --description "CI 실패 자동 알림" --force

      # 열린 것이 있으면 새로 만들지 않고 댓글만 단다. 연속으로 깨질 때 이슈가
      # 커밋 수만큼 생기면 알림이 다시 소음이 되고, 소음은 안 보는 것과 같다.
      #
      # 담당자는 푸시한 사람이다. 팀 저장소라 "누군가 봐야 한다"는 아무도 안 본다는
      # 뜻이 되기 쉽고, 배정은 메일과 달리 받는 사람이 정해진다.
      - name: 실패 -> 이슈
        if: needs.test.result == 'failure'
        run: |
          BODY="브랜치 $GITHUB_REF_NAME 의 CI가 실패했다.

          커밋: $GITHUB_SHA
          실행: $RUN_URL

          같은 브랜치의 CI가 다시 통과하면 이 이슈는 자동으로 닫힌다."

          # 제목이 정확히 일치하는 것만 고른다. --search를 쓰지 않는 것은 그쪽이
          # 검색 색인을 거쳐 방금 만든 이슈가 아직 안 잡힐 수 있기 때문이다.
          OPEN=$(gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
                   | jq -r --arg t "$TITLE" 'map(select(.title == $t)) | .[0].number // empty')

          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            NEW=$(gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY")
            # 배정 실패로 이슈 자체를 잃지 않는다. 알리는 것이 배정보다 중요하다.
            gh issue edit "$NEW" --add-assignee "$GITHUB_ACTOR" || true
          fi

      # 고친 뒤에도 이슈가 열려 있으면 다음 빨간불이 "이미 열려 있네"에 묻힌다.
      # 여는 것과 닫는 것이 한 쌍이어야 이 신호를 계속 믿을 수 있다.
      #
      # 닫는 것도 이 브랜치 것만 닫는다. 여는 쪽과 같은 키를 써야 한 쌍이 성립한다.
      - name: 복구 -> 이슈 닫기
        if: needs.test.result == 'success'
        run: |
          gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
            | jq -r --arg t "$TITLE" '.[] | select(.title == $t) | .number' \
            | while read -r N; do
                gh issue close "$N" --comment "브랜치 $GITHUB_REF_NAME 의 CI가 다시 통과했다. 실행: $RUN_URL"
              done

# ---------------------------------------------------------------------------
# CI가 검증하는 것
#
# 로컬 전체 실행 기준 121개 중 115개가 돌고 6개가 skip된다(2026-08-07).
# 아래는 이전에 "CI에서 전부 skip된다"고 적혀 있던 것들이며, 지금은 모두 돈다.
#
#   - 컨텍스트 로딩         DocKinSpringApplicationTests
#   - 스키마 정합성         SchemaValidationTest
#   - Flyway 마이그레이션   FlywayMigrationTest
#   - pgvector 타입/검색    VectorTypeMappingTest, VectorSearchQueryTest
#   - 락 타임아웃           LockTimeoutVerificationTest
#   - 배치 INSERT           HibernateBatchInsertVerificationTest
#   - 연차 차감 동시성      LeaveBalanceConcurrencyTest
#
# CI가 검증하지 않는 것 (알면서 뺀 것들 -- 조용히 빠지지 않도록 적어둔다)
#
#   - AnnRecallMeasurementTest        DB_PASSWORD + RUN_ANN_RECALL + 코퍼스 1000건 초과
#   - BruteForceSearchBenchmarkTest   DB_PASSWORD
#   - CorpusSeedGeneratorTest         DB_PASSWORD + SEED_CORPUS_SIZE (3개 중 1개)
#   - CrossLingualRetrievalTest       localhost:8081 임베딩 서버
#
# 앞의 셋은 측정용이라 CI에 넣을 시간이 아니다(10만 청크 적재 등). 빼는 것 자체는 맞다.
# 다만 그 스위치가 여전히 DB_PASSWORD인 것은 이름이 실제와 어긋난 상태다 --
# 이제 DB 제공과 아무 상관이 없고 '오래 걸림'만 뜻한다. JUnit @Tag로 바꾸는 것이 P0-11이며,
# 그때까지 이 변수명이 오해를 부를 수 있다는 점을 여기 적어둔다.
#
# 마지막 것은 외부 서비스가 필요해 성격이 다르다. 임베딩 서버를 CI에 띄울지는 별도 판단이다.
# ---------------------------------------------------------------------------
