spring.application.name=DOCKin-spring

# [Database Configuration]

#[aws MySQL]
# rewriteBatchedStatements=true: 이게 없으면 hibernate.jdbc.batch_size를 켜도 MySQL 드라이버가
# 문장을 하나씩 보내 배치 효과가 사라진다. 둘은 반드시 함께 설정해야 한다.
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/dockindb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
#spring.datasource.url=jdbc:mysql://dockin-db.crioe6iq4jv2.ap-northeast-2.rds.amazonaws.com:3306/dockindb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
#spring.datasource.username=admin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [HikariCP]
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# [Redis] - 출근 체크 분산락용
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# [SQL Init]
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.data-locations=classpath:data.sql

# [JPA / Hibernate]
spring.jpa.hibernate.ddl-auto=update

# JDBC 배치.
#
# [주의] 현재 INSERT에는 이 설정이 적용되지 않는다. 검증 완료.
#   DocumentChunk가 GenerationType.IDENTITY라 Hibernate가 INSERT 직후 생성 키를 읽어야 하고,
#   그래서 문장을 묶지 못한다. 에러도 경고도 없이 조용히 무시된다.
#   MySQL Com_insert로 측정: 10,000건 저장 시 실행된 INSERT 문장이 정확히 10,000 (문장당 1행).
#   검증 코드: HibernateBatchInsertVerificationTest
#
# UPDATE에는 유효하다. IDENTITY 제약은 INSERT에만 해당하므로, 재색인 시 발생하는
# UPDATE는 배치로 묶인다. 그래서 설정을 지우지 않고 남겨둔다.
#
# 근본 해결은 PostgreSQL 이전 후 GenerationType.SEQUENCE 전환이다(ADR-0006 3절, 8절).
# 시퀀스는 INSERT 전에 키를 받아오므로 배치가 정상 동작한다.
# JdbcTemplate 벌크 INSERT로 우회할 수도 있으나, Phase 2에서 걷어내야 할 임시 부채가 되어 택하지 않았다.
#
# MySQL은 rewriteBatchedStatements=true가 있어야 드라이버가 실제로 묶어 보낸다(URL 참고).
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.defer-datasource-initialization=false

# [Logging]
logging.level.org.springframework.boot.autoconfigure.sql.init=DEBUG

# [JWT]
jwt.expiration_time=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}
jwt.refresh_expiration_time=${JWT_REFRESH_EXPIRATION}

# [SWAGGER]
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# [FastAPI Configuration]
external-api.fastapi.base-url=${AI_SERVER_URL}

# RAG 임베딩 추론 서버 (TEI). 도커 밖 로컬 실행 시 8081 포트를 기본값으로 쓴다.
external-api.embedding.base-url=${EMBEDDING_SERVER_URL:http://localhost:8081}
# 모델명은 document_chunks.embedding_model에 기록되어 모델 교체 시 구버전 청크 식별에 쓰인다.
rag.embedding.model=intfloat/multilingual-e5-small
# 배치 호출이 단건 대비 약 8배 빠르다(실측: 12ms/건 vs 99ms/건).
# TEI 기본 max-client-batch-size가 32라 그에 맞춘다.
rag.embedding.batch-size=32
# 인덱싱 배치 실행 여부. 로컬/테스트에서는 끔 수 있다.
rag.indexing.enabled=true
# 기본 매일 03:00. 10만 청크 기준 약 20분 소요(실측).
rag.indexing.cron=0 0 3 * * *
# 근거로 채택할 최소 코사인 유사도. 0.0이면 비활성.
# e5 계열은 무관한 문장 사이에서도 코사인이 높게 나오는 경향이 있어 절대 임계값을 감으로 정하면
# 정상 근거까지 버린다. 유사도 분포를 실측한 뒤 값을 정한다. [실측 필요]
rag.search.min-score=0.0
# 챗봇 프롬프트에 붙일 근거 청크 최대 개수. 청크당 약 500자이므로 5건이면 약 2,500자다.
rag.search.top-k=5

# 미체크 인원 결근 처리 배치. 전날을 대상으로 하므로 자정 직후에 돈다.
# 주말은 건너뛰지만 공휴일은 판단하지 못한다(근무일 캘린더 부재) - AttendanceBatchService 주석 참고.
attendance.absent-batch.enabled=true
attendance.absent-batch.cron=0 10 0 * * *

# [File Upload Configuration]
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.async.request-timeout=120000

# [Whitelist]
security.whitelist[0]=/
security.whitelist[1]=/error
security.whitelist[2]=/favicon.ico
security.whitelist[3]=/v3/api-docs
security.whitelist[4]=/v3/api-docs/
security.whitelist[5]=/v3/api-docs/**
security.whitelist[6]=/swagger-ui/**
security.whitelist[7]=/swagger-ui.html
security.whitelist[8]=/api-docs/**
security.whitelist[9]=/swagger-resources/**
security.whitelist[10]=/webjars/**
security.whitelist[11]=/member/login
security.whitelist[12]=/member/signup
security.whitelist[13]=/css/**
security.whitelist[14]=/js/**
security.whitelist[15]=/img/**
security.whitelist[16]=/ws/**
