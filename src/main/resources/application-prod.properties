# 운영 프로파일. 켜는 법: 호스트 .env 에 SPRING_PROFILES_ACTIVE=prod (compose.yaml 이 넘긴다).
#
# 여기에는 "운영에서만 달라야 하는 것"만 둔다. 공통값은 application.properties 에 있고,
# 비밀값은 여기도 아니고 호스트 .env 다(docs/OPERATIONS-DEPLOY.md 3절).
#
# 이 파일 이전에는 운영과 로컬이 같은 설정으로 떴다. compose.yaml 이 SPRING_PROFILES_ACTIVE=secret 을
# 주고 있었지만 application-secret.properties 는 저장소 어디에도 없었다 -- 이름만 있는 프로파일이었다.

# [Swagger] 닫는다 (PRODUCTION-READINESS R3).
# 화이트리스트(security.whitelist)에 /v3/api-docs 와 /swagger-ui 가 열려 있어 운영에서도 누구나
# 전체 API 목록과 ErrorCode 표를 읽을 수 있었다. 화이트리스트는 인덱스 목록이라 프로파일에서
# 일부만 빼기 어렵다 -- 대신 엔드포인트 자체를 꺼서 404 로 만든다(ProdProfileTest 가 확인).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# [CORS] 기본값을 없앤다.
# 공통 파일의 기본값은 localhost 목록이라, 운영에서 CORS_ALLOWED_ORIGINS 를 빠뜨리면 실제 도메인이
# 막히고 localhost 가 열린 채로 "정상" 기동한다. 여기서는 값이 없으면 기동이 실패한다.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# [챗봇 스텁] 운영에서는 고정으로 끈다.
# 공통 파일은 AI_CHATBOT_STUB 환경변수로 켤 수 있다. 여기서 상수로 덮으면 .env 에 남은 값이 있어도
# 운영 챗봇이 근거 목록을 답이라고 내보내는 일이 없다. ProdProfileGuard 가 한 번 더 본다.
ai.chatbot.stub=false

# [기동 직후 색인] seed 프로파일 전용이다. 운영에서는 03:00 배치만 돈다.
rag.indexing.on-startup=false

# [health 세부 항목] 공통과 같다(when-authorized). 운영에서 always 로 바꾸는 실수를 막으려고 다시 적는다.
management.endpoint.health.show-details=when-authorized
