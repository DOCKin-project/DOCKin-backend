# CodeRabbit 리뷰 설정.
#
# CI(.github/workflows/ci.yml)와 역할이 겹치지 않는다.
#   CI          -- 컴파일과 단위 테스트. "도는가"를 본다.
#   CodeRabbit  -- 변경의 의도와 근거. "맞는가"를 본다.
#
# CI 하단의 "검증하지 않는 것" 목록이 길다(DB가 필요한 테스트 8종이 skip된다).
# 그 빈칸을 사람 눈 대신 메워주는 것이 이 도구의 실질적 쓸모다.

language: "ko-KR"

reviews:
  # 이 저장소의 커밋은 "무엇을 고쳤다"가 아니라 "무엇이 틀려 있었다"를 적는다.
  # 리뷰도 같은 밀도가 필요하므로 chill보다 assertive를 쓴다.
  profile: "assertive"

  # 리뷰 코멘트로 머지를 막지 않는다. 판단은 사람이 한다.
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  collapse_walkthrough: false

  # 시는 필요 없다.
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"
      - "main"

  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
    - "!**/*.jar"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        - 선언과 실제가 어긋나는 곳을 우선 본다. 이 저장소에서 반복해 나온 결함 유형이다:
          설정은 있는데 적용되지 않는 것(batch_size가 IDENTITY에 막힘, JPA 락 힌트를
          MySQL이 무시, @Lob이 ddl-auto=validate를 통과, JAVA_OPTS가 ENTRYPOINT에서
          참조되지 않음). "이 설정/애노테이션이 실제로 효과가 있는가"를 물어라.
        - 클래스명은 자바 컨벤션을 따른다. 스네이크 케이스나 소문자 시작이 남아 있으면 지적한다.
        - 트랜잭션 안에서 외부 HTTP를 호출하면 반드시 지적한다. 타임아웃이 없으면
          커넥션 풀이 마르고 서비스 전체가 멎는다(P2-9-1에서 실제로 확인됐다).

    - path: "src/main/resources/db/migration/**"
      instructions: |
        - 이미 적용된 버전 파일의 내용 수정은 체크섬을 깨뜨린다. V*.sql 수정은 반드시 지적한다.
        - 기존 DB에도 적용되므로 멱등한지 본다(IF NOT EXISTS 등).

    - path: "**/*.properties"
      instructions: |
        - 값을 바꿀 때 그 값이 실제로 읽히는 경로가 있는지 본다.
          읽히지 않는 설정을 고치는 것은 고친 것이 아니다.
        - 비밀번호/토큰이 평문으로 들어가면 반드시 지적한다.

    - path: "{compose.yaml,Dockerfile}"
      instructions: |
        - 컨테이너 메모리 제한과 JVM 힙 상한이 같으면 지적한다. 힙 밖 영역(메타스페이스,
          스레드 스택, 다이렉트 버퍼) 때문에 종료코드 137로 조용히 죽는다.
        - 환경변수로 준 JVM 옵션이 ENTRYPOINT에서 실제로 참조되는지 확인한다.

    - path: "docs/**"
      instructions: |
        - 수치가 나오면 그 출처가 실측인지 가정인지 구분되어 있는지 본다.
          이 저장소는 가정에 [실측 필요], 미검증 설정에 [미검증]을 붙이는 규칙을 쓴다.
        - 같은 수치가 다른 문서에 다르게 적혀 있으면 지적한다(P2-13-3이 그 사례다).

chat:
  auto_reply: true
