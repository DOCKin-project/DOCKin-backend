plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.DOCKin'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {


	testImplementation 'com.h2database:h2'
	//websocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	//JPA library
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// DB 마이그레이션. Hibernate ddl-auto가 만들 수 없는 것을 담당한다 —
	// CREATE EXTENSION(테이블보다 먼저 필요)과 HNSW 인덱스(@Index는 btree만 만든다).
	// Spring Boot는 JPA EntityManagerFactory보다 Flyway를 먼저 실행하므로 순서가 보장된다.
	//
	// flyway-core가 아니라 spring-boot-flyway를 넣는다. Spring Boot 4에서 자동 구성이
	// 기술별 모듈로 쪼개져 FlywayAutoConfiguration이 spring-boot-autoconfigure에 더 이상 없다.
	// flyway-core만 넣으면 라이브러리는 클래스패스에 있는데 아무도 실행하지 않아
	// 마이그레이션이 조용히 건너뛰어진다(실제로 그렇게 확인했다). flyway-core는 이 모듈이 끌어온다.
	implementation 'org.springframework.boot:spring-boot-flyway'
	// Flyway 10부터 DB별 지원이 모듈로 분리되었다. 없으면 PostgreSQL을 인식하지 못한다.
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// pgvector의 vector 타입 매핑 (ADR-0006 Phase 2b).
	// Hibernate 6.4부터 제공되는 공식 모듈이라 커스텀 UserType이 필요 없다.
	// @JdbcTypeCode(SqlTypes.VECTOR) + @Array(length=384)로 매핑되고,
	// HQL에 cosine_distance() 등 거리 함수가 등록된다.
	implementation 'org.hibernate.orm:hibernate-vector'

	//security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	//ModelMapper
	implementation group: 'org.modelmapper', name: 'modelmapper', version: '2.4.2'

	//validation
	implementation group: 'jakarta.validation', name: 'jakarta.validation-api', version: '3.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.security:spring-security-config'

	//Websocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// PostgreSQL로 이관(ADR-0006 3절). MySQL 드라이버는 이관 검증용 벤치마크 테스트가
	// 아직 참조하므로 testRuntimeOnly로 남겨둔다.
	runtimeOnly 'org.postgresql:postgresql'
	testRuntimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	compileOnly 'org.projectlombok:lombok'
	//developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//s3 upload
	implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

	// WebClient
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Redis distributed lock
	implementation 'org.redisson:redisson:3.37.0'

}

tasks.named('test') {
	useJUnitPlatform()

	// 이 저장소의 테스트 일부는 검증이 아니라 측정이 목적이고, 그 결과를 System.out으로 낸다
	// (BruteForceSearchBenchmarkTest, HibernateBatchInsertVerificationTest, AnnRecallMeasurementTest).
	// Gradle은 기본적으로 테스트의 표준 출력을 삼키므로, 켜두지 않으면 측정값을 볼 수 없다.
	testLogging {
		showStandardStreams = true
		events 'passed', 'failed', 'skipped'
		// 건너뛴 이유를 보여준다. 측정 테스트는 환경변수 게이트로 skip되는 경우가 많은데,
		// 이유가 안 보이면 "통과했다"와 "돌지 않았다"가 구분되지 않는다.
		exceptionFormat = 'full'
	}
}
