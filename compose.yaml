version: '3.8'

services:
  dockin-nginx:
    image: nginx:latest
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - dockin-app
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M

  dockin-app:
    #build: .
    env_file:
      - .env
    image: khyojae/dockin-app:latest
    container_name: dockin-app-1
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=DOCKin-DB
      - DB_NAME=dockindb
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=dockin-redis
      - REDIS_PORT=6379
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - SPRING_PROFILES_ACTIVE=secret
      - TZ=Asia/Seoul
      - RACK_ENV=development
      - JAVA_OPTS=-Xmx400M -Xms256M
      - AI_SERVER_URL=${AI_SERVER_URL}
      - EMBEDDING_SERVER_URL=http://dockin-embedding:80
      - cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
      - cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
      - cloud.aws.region.static=${AWS_REGION}
      - cloud.aws.s3.bucket=${S3_BUCKET_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      DOCKin-DB:
        condition: service_healthy
      dockin-redis:
        condition: service_started
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 512M # Spring Boot 최대치 제한

  dockin-redis:
    image: redis:7-alpine
    container_name: dockin-redis
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M # 출근 분산락 전용, 소용량으로 제한

  DOCKin-DB:
    image: mysql:8.0
    container_name: dockin-db
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 락 대기 한도. 기본값 50초는 사용자가 승인 버튼을 누르고 50초를 기다린 끝에
      # 실패를 보게 되어 최악의 경험이 된다. 빨리 실패하고 재시도하는 편이 낫다.
      #
      # JPA의 jakarta.persistence.lock.timeout 힌트로는 조정할 수 없다 - 검증 결과
      # 힌트를 걸어도 SQL에 반영되지 않고(FOR UPDATE에 대기 시간 문법이 없다) 50초가 그대로 적용됐다.
      # MySQL은 NOWAIT / SKIP LOCKED만 지원하므로 서버 파라미터가 유일한 수단이다.
      # 검증 코드: LockTimeoutVerificationTest
      - --innodb-lock-wait-timeout=5
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=dockindb
      - TZ=Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - dockin_db_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 300M # MySQL 메모리 점유 제한

  # RAG 임베딩 추론 서버 (HuggingFace text-embeddings-inference)
  # 팀원 FastAPI(AI_SERVER_URL)와는 별개 서비스다. 번역/STT와 무관하며 텍스트->벡터 변환만 담당한다.
  # dockin-app이 depends_on을 걸지 않는 이유: 임베딩 서버가 죽어도 검색은 LIKE 폴백으로 동작해야 하므로
  # 기동 의존성을 만들지 않는다(ADR-0001의 "Redis가 죽어도 DB가 최종 방어선" 원칙과 동일).
  dockin-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: dockin-embedding
    command:
      # multilingual-e5-small: 118M 파라미터 / 384차원.
      # bge-m3(568M)는 이 환경(i3-6100, 2코어)에서 인덱싱 처리량이 안 나와 제외했다.
      - --model-id=intfloat/multilingual-e5-small
      # 모델 최대 시퀀스(512 토큰) 초과 입력에서 에러 대신 잘라내기. 작업일지 본문이 길 수 있다.
      - --auto-truncate
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8081:80"
    volumes:
      - embedding_cache:/data # 모델 가중치 캐시. 최초 1회만 다운로드한다.
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  dockin-network:
    driver: bridge

volumes:
  dockin_db_data:
  embedding_cache: