version: '3.8'

services:
  dockin-nginx:
    image: nginx:latest
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - dockin-app
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.25' # 리버스 프록시. 실측에서 유의미하게 잡힌 적이 없다

  dockin-app:
    #build: .
    env_file:
      - .env
    image: khyojae/dockin-app:latest
    container_name: dockin-app-1
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=DOCKin-DB
      - DB_NAME=dockindb
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=dockin-redis
      - REDIS_PORT=6379
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - SPRING_PROFILES_ACTIVE=secret
      - TZ=Asia/Seoul
      - RACK_ENV=development
      # 이 변수는 2026-08-06까지 아무 효과가 없었다. Dockerfile의 ENTRYPOINT가 exec 형식이라
      # 셸을 거치지 않아 $JAVA_OPTS가 확장되지 않았다(P2-10-1). 이제는 읽힌다.
      # Dockerfile이 기본값 -Xmx400M을 갖고 있으므로 여기서는 덮어쓸 때만 값을 준다.
      # 지금은 기본값과 같은 값이라 주석 처리해둔다 -- 같은 수치를 두 곳에 적으면
      # 한쪽만 고치는 사고가 난다(P2-13-3이 그 사례다).
      #- JAVA_OPTS=-Xmx300M
      - AI_SERVER_URL=${AI_SERVER_URL}
      - EMBEDDING_SERVER_URL=http://dockin-embedding:80
      - cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
      - cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
      - cloud.aws.region.static=${AWS_REGION}
      - cloud.aws.s3.bucket=${S3_BUCKET_NAME}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      DOCKin-DB:
        condition: service_healthy
      dockin-redis:
        condition: service_started
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 512M # Spring Boot 최대치 제한
          # "색인 중에는 청킹과 HTTP 호출뿐이라 가볍다"고 적었는데 틀렸다.
          # 실측에서 이 컨테이너가 주기의 12.6%를 상한에 막혀 서 있었다
          # (nr_throttled 1593 / nr_periods 12635). 가볍지 않다.
          cpus: '1.0'

  dockin-redis:
    image: redis:7-alpine
    container_name: dockin-redis
    environment:
      - TZ=Asia/Seoul
    ports:
      - "6379:6379"
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 100M # 출근 분산락 전용, 소용량으로 제한
          cpus: '0.25' # 분산락 SETNX 수준. 메모리와 같은 이유로 소용량

  # MySQL 8.0에서 PostgreSQL로 이관했다(ADR-0006 3절). 이관 근거 요약:
  #  - 벡터 검색: MySQL 8.0에 ANN 인덱스가 없다(9.x의 VECTOR도 인덱스는 HeatWave 전용).
  #    브루트포스 10만 청크가 5.2초이고 병목의 81%가 애플리케이션으로 벡터를 가져오는 전송이라,
  #    유사도 계산을 DB 안에서 끝내는 pgvector가 유일한 해법이다.
  #  - 배치 INSERT: IDENTITY 전략이 JDBC 배치를 막았다. 시퀀스는 INSERT 전에 키를 받아 배치가 된다.
  #  - 락 대기 한도: MySQL은 서버/세션 단위까지만 조정 가능하나, PostgreSQL은
  #    SET LOCAL lock_timeout으로 트랜잭션 단위 조정이 된다.
  #
  # 이미지는 pgvector 포함본을 쓴다. 순수 postgres의 상위 집합이라 지금 비용이 없고,
  # 2b(pgvector 도입) 때 이미지를 다시 바꾸지 않아도 된다.
  DOCKin-DB:
    image: pgvector/pgvector:pg17
    container_name: dockin-db
    command:
      # 락 대기 한도. 기본값은 무제한(0)이라 승인이 영원히 매달릴 수 있다.
      # 전역 기본은 5초로 두고, 오래 잡아야 하는 배치는 트랜잭션 단위로 SET LOCAL로 늘린다.
      # MySQL에서는 이 트랜잭션 단위 조정이 불가능해 전역 5초로 고정할 수밖에 없었다.
      - -c
      - lock_timeout=5s
      # 데드락 감지 주기. 기본 1초.
      - -c
      - deadlock_timeout=1s
      # 실행된 문장 수를 세기 위해 활성화한다. MySQL의 Com_insert에 해당하는 수단으로,
      # "배치 설정이 실제로 동작하는가"를 추정이 아니라 DB가 센 값으로 확인하는 데 쓴다.
      # (MySQL 시절 batch_size가 IDENTITY 때문에 조용히 무시되던 것을 이 방식으로 잡아냈다.)
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=dockindb
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - dockin_db_data:/var/lib/postgresql/data
      # docker-entrypoint-initdb.d 마운트를 제거했다(2026-08-05).
      # CREATE EXTENSION vector를 여기서 하고 있었으나 두 가지 한계가 있었다 --
      # 데이터 디렉터리가 비어 있을 때만 돌아 기존 볼륨에는 적용되지 않았고,
      # 그 시점에는 테이블이 없어 HNSW 인덱스는 어차피 만들 수 없었다.
      # 지금은 Flyway V1이 확장->테이블->인덱스를 기동 경로에서 한 번에 보장한다.
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dockindb" ]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - dockin-network
    deploy:
      resources:
        limits:
          memory: 512M # MySQL(300M)보다 여유를 둔다. 벡터 검색 시 공유 버퍼가 필요하다.
          # 색인 중 실측 180%. 그 수요를 거의 그대로 보장한다.
          # 다섯 중 스로틀링이 가장 적었다(4.3%). 값이 수요에 맞다는 뜻이다.
          cpus: '1.5'

  # RAG 임베딩 추론 서버 (HuggingFace text-embeddings-inference)
  # 팀원 FastAPI(AI_SERVER_URL)와는 별개 서비스다. 번역/STT와 무관하며 텍스트->벡터 변환만 담당한다.
  # dockin-app이 depends_on을 걸지 않는 이유: 임베딩 서버가 죽어도 검색은 LIKE 폴백으로 동작해야 하므로
  # 기동 의존성을 만들지 않는다(ADR-0001의 "Redis가 죽어도 DB가 최종 방어선" 원칙과 동일).
  dockin-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: dockin-embedding
    command:
      # multilingual-e5-small: 118M 파라미터 / 384차원.
      # bge-m3(568M)는 이 환경(i3-6100, 2코어)에서 인덱싱 처리량이 안 나와 제외했다.
      - --model-id=intfloat/multilingual-e5-small
      # 모델 최대 시퀀스(512 토큰) 초과 입력에서 에러 대신 잘라내기. 작업일지 본문이 길 수 있다.
      - --auto-truncate
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8081:80"
    volumes:
      - embedding_cache:/data # 모델 가중치 캐시. 최초 1회만 다운로드한다.
    networks:
      - dockin-network
    # CPU 상한을 주는 이유 -- 처리량이 아니라 격리다 (2026-08-06 개정)
    #
    #  [처음 적었던 근거는 틀렸다]
    #  색인 중 CPU가 dockin-embedding 560% / dockin-db 180%인 것을 보고
    #  "TEI가 PostgreSQL을 굶기고 있으니 묶으면 빨라진다"고 적었다(6-8).
    #  관찰은 사실이었지만 해석이 틀렸다. 같은 코퍼스 위치에서 상한만 걷어내
    #  대조 측정을 했더니 반대 결과가 나왔다(6-11, compose.nocpu.yaml).
    #
    #    상한 있음  원본당 611.0ms
    #    상한 없음  원본당 521.2ms   <- 상한을 걸면 오히려 17% 느리다
    #
    #  TEI가 CPU를 많이 쓰는 것은 DB를 굶겨서가 아니라 그냥 일을 많이 해서였다.
    #
    #  [그래도 남기는 이유]
    #  색인 17%를 내주고 사는 것은 블라스트 반경이다. 상한이 없으면 TEI 하나가
    #  호스트 4스레드를 전부 가져가 같은 머신의 다른 것들(IDE, 다른 프로젝트
    #  컨테이너)까지 멈춰 세운다. 실제로 그 상태로 돌고 있었다.
    #
    #  다섯 컨테이너 상한의 합은 5.0으로 호스트 4를 넘지만 상한은 예약이 아니다.
    #  한가한 쪽의 몫이 놀지 않으면서도 어느 하나가 전부를 가져가지는 못한다.
    #
    #  [값의 근거는 여전히 약하다] 2.0이라는 숫자는 "호스트의 절반"일 뿐 측정으로
    #  고른 값이 아니다. 격리가 목적이라면 더 올려도 되고, 그러면 17%를 되찾는다.
    #  올렸을 때의 처리량은 아직 안 쟀다. `[실측 필요]`
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

networks:
  dockin-network:
    driver: bridge

volumes:
  dockin_db_data:
  embedding_cache: